<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6B7280"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="120" fill="url(#bg)"/>
  <!-- Analytics chart icon -->
  <g transform="translate(400,400)">
    <!-- X-axis -->
    <line x1="-180" y1="120" x2="180" y2="120" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round"/>
    <!-- Y-axis -->
    <line x1="-180" y1="120" x2="-180" y2="-180" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round"/>
    <!-- Chart line -->
    <path d="M -120 60 L -40 -20 L 40 40 L 140 -120" stroke="#FFFFFF" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Data points -->
    <circle cx="-120" cy="60" r="20" fill="#FFFFFF"/>
    <circle cx="-40" cy="-20" r="20" fill="#FFFFFF"/>
    <circle cx="40" cy="40" r="20" fill="#FFFFFF"/>
    <circle cx="140" cy="-120" r="20" fill="#FFFFFF"/>
  </g>
</svg>
